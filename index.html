<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>R.S Tech Bazaar</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,"Noto Sans Bengali",sans-serif;background:#f5f6f8;color:#222}
header{background:#111827;color:white;padding:18px 5%;display:flex;justify-content:space-between;align-items:center;gap:15px;position:sticky;top:0;z-index:5}
.logo{font-size:24px;font-weight:800}.cart{background:#2563eb;border:0;color:#fff;padding:10px 15px;border-radius:8px;font-weight:bold}
.hero{padding:45px 5%;background:linear-gradient(135deg,#1d4ed8,#111827);color:white;text-align:center}
.hero h1{font-size:36px;margin-bottom:10px}.hero p{font-size:17px}
.container{max-width:1100px;margin:auto;padding:25px 5%}
.search{width:100%;padding:14px;border:1px solid #ddd;border-radius:10px;margin-bottom:22px;font-size:16px}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:18px}
.card{background:white;border-radius:14px;padding:18px;box-shadow:0 3px 12px #00000012}
.pic{height:150px;background:#eef2ff;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:55px;margin-bottom:13px}
.card h3{margin-bottom:8px}.price{color:#2563eb;font-weight:800;font-size:20px;margin:8px 0 13px}
.card button,.order button{width:100%;padding:12px;border:0;border-radius:8px;background:#2563eb;color:white;font-weight:bold;cursor:pointer}
.contact{margin-top:30px;background:white;padding:25px;border-radius:14px;text-align:center}
.contact a{display:inline-block;margin:8px 4px;padding:11px 16px;border-radius:8px;text-decoration:none;color:white;font-weight:bold}
.bk{background:#e2136e}.wa{background:#16a34a}.call{background:#111827}
footer{text-align:center;padding:25px;background:#111827;color:white;margin-top:30px}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:10;padding:25px}
.box{background:white;max-width:500px;margin:5vh auto;padding:25px;border-radius:14px}
.box input,.box textarea{width:100%;padding:12px;margin:7px 0 12px;border:1px solid #ddd;border-radius:8px}
.close{float:right;border:0;background:none;font-size:25px;cursor:pointer}
@media(max-width:500px){.hero h1{font-size:29px}}
</style>
</head>
<body>

<header>
<div class="logo">R.S Tech Bazaar</div>
<button class="cart" onclick="openCart()">🛒 Cart (<span id="count">0</span>)</button>
</header>

<section class="hero">
<h1>R.S Tech Bazaar</h1>
<p>মোবাইল, ইলেকট্রনিক্স ও এক্সেসরিজ—সহজে অর্ডার করুন</p>
</section>

<main class="container">
<input class="search" id="search" oninput="showProducts()" placeholder="🔎 পণ্যের নাম লিখে খুঁজুন...">
<div class="products" id="products"></div>

<div class="contact">
<h2>যোগাযোগ ও অর্ডার</h2>
<p style="margin:10px 0">📞 01304539305</p>
<a class="bk" href="tel:01304539305">💳 bKash</a>
<a class="wa" href="https://wa.me/8801304539305" target="_blank">💬 WhatsApp</a>
<a class="call" href="tel:01304539305">📞 Call Now</a>
</div>
</main>

<footer>© 2026 R.S Tech Bazaar — All Rights Reserved</footer>

<div class="modal" id="modal">
<div class="box">
<button class="close" onclick="closeCart()">×</button>
<h2>🛒 আপনার অর্ডার</h2>
<div id="cartItems" style="margin:18px 0"></div>
<div class="order">
<input id="name" placeholder="আপনার নাম">
<input id="phone" placeholder="মোবাইল নম্বর">
<textarea id="address" rows="3" placeholder="ডেলিভারি ঠিকানা"></textarea>
<button onclick="sendOrder()">WhatsApp-এ অর্ডার পাঠান</button>
</div>
</div>
</div>

<script>
const products=[
 {name:"স্মার্টফোন",price:"৳ 9,500",icon:"📱"},
 {name:"ব্লুটুথ ইয়ারফোন",price:"৳ 850",icon:"🎧"},
 {name:"চার্জার",price:"৳ 550",icon:"🔌"},
 {name:"পাওয়ার ব্যাংক",price:"৳ 1,200",icon:"🔋"},
 {name:"স্মার্ট ওয়াচ",price:"৳ 1,500",icon:"⌚"},
 {name:"মোবাইল কভার",price:"৳ 300",icon:"📱"}
];
let cart=[];
function showProducts(){
 const q=document.getElementById("search").value.toLowerCase();
 const list=products.filter(p=>p.name.toLowerCase().includes(q));
 document.getElementById("products").innerHTML=list.map((p,i)=>`
 <div class="card"><div class="pic">${p.icon}</div><h3>${p.name}</h3>
 <div class="price">${p.price}</div><button onclick="add(${products.indexOf(p)})">কার্টে যোগ করুন</button></div>`).join("");
}
function add(i){cart.push(products[i]);document.getElementById("count").textContent=cart.length;alert("পণ্যটি কার্টে যোগ হয়েছে");}
function openCart(){
 document.getElementById("modal").style.display="block";
 document.getElementById("cartItems").innerHTML=cart.length?cart.map((p,i)=>`${i+1}. ${p.name} — ${p.price}`).join("<br>"):"কার্ট খালি।";
}
function closeCart(){document.getElementById("modal").style.display="none";}
function sendOrder(){
 if(!cart.length)return alert("আগে একটি পণ্য কার্টে যোগ করুন।");
 const name=document.getElementById("name").value, phone=document.getElementById("phone").value, address=document.getElementById("address").value;
 if(!name||!phone||!address)return alert("নাম, ফোন ও ঠিকানা পূরণ করুন।");
 const items=cart.map(p=>p.name+" - "+p.price).join("%0A");
 const msg=`R.S Tech Bazaar Order%0Aনাম: ${encodeURIComponent(name)}%0Aফোন: ${encodeURIComponent(phone)}%0Aঠিকানা: ${encodeURIComponent(address)}%0Aপণ্য:%0A${items}`;
 window.open("https://wa.me/8801304539305?text="+msg,"_blank");
}
showProducts();
</script>
</body>
</html>
